name: voicetrans
description: "声译通 VoiceTrans —— 长时间录音 + 实时语音识别与离线翻译（免费、无账号、翻译本地运行）"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  speech_to_text: ^7.5.0
  record: ^7.1.1
  google_mlkit_translation: ^0.15.1
  shared_preferences: ^2.3.2
  path_provider: ^2.1.5
  just_audio: ^0.10.2
  intl: ^0.20.2
  uuid: ^4.5.1
  wakelock_plus: ^1.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
