name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build APK
        run: flutter build apk --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: voicetrans-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  ios:
    name: iOS (unsigned IPA)
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          mkdir -p build/ios/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/Payload/Runner.app
          cd build/ios && zip -qry VoiceTrans-ios-unsigned.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: voicetrans-ios-ipa
          path: build/ios/VoiceTrans-ios-unsigned.ipa

  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            # 声译通 VoiceTrans ${{ github.ref_name }}

            ## 安装说明

            ### Android
            下载 `app-release.apk`，在手机上直接安装（需允许“安装未知来源应用”）。

            ### iOS
            `VoiceTrans-ios-unsigned.ipa` 为**未签名**安装包（Apple 平台限制，未加入开发者账号无法分发签名包）：
            - 用 AltStore / Sideloadly 等工具自签后安装；
            - 或在 Mac 上用 Xcode 打开本仓库 `ios/` 目录，配置自己的签名后运行；
            - 有 Apple 开发者账号的可自行用 TestFlight 分发。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
